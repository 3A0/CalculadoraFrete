<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de Frete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: formulário à esquerda (rota + carga), resultado à direita.
   Cores das entradas seguem a planilha: amarelo = preencher, laranja = vem da rota, azul = resultado. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5b6878;
  --line: #d3d9e1;
  --fill: #f9e27a;
  --route: #f4a340;
  --result: #1677b8;
  --result-soft: #e3f0fa;
  --good: #1f7a4d;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #19212a; --ink: #e6ebf1; --muted: #93a1b2; --line: #2c3743;
  --fill: #c9ad2e; --route: #d98a2b; --result: #4aa8e8; --result-soft: #15293a; --good: #52c48a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --ink: #e6ebf1; --muted: #93a1b2; --line: #2c3743;
  --fill: #c9ad2e; --route: #d98a2b; --result: #4aa8e8; --result-soft: #15293a; --good: #52c48a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 24px; }
header h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; letter-spacing: .01em; margin: 0; line-height: 1; text-transform: uppercase; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: .85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 18px; min-width: 0; }
.eyebrow { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .85rem; color: var(--muted); margin: 0; }
label { font-weight: 500; font-size: .9rem; display: block; margin-bottom: 4px; }
select, input { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; }
input { font-family: var(--font-mono); font-size: .95rem; font-variant-numeric: tabular-nums; }
select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--result); outline-offset: 1px; }
.in-fill { border-left: 6px solid var(--fill); }
.in-route { border-left: 6px solid var(--route); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 460px) { .grid2 { grid-template-columns: 1fr; } }
.route-facts { display: flex; flex-wrap: wrap; gap: 8px; font-size: .85rem; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-family: var(--font-mono); font-size: .78rem; }
.reset { justify-self: start; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: .85rem; cursor: pointer; }
.reset:hover { border-color: var(--route); }

.cte { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.cte-head { background: var(--result); color: #fff; padding: 16px 20px; }
.cte-head .eyebrow { color: rgba(255,255,255,.8); }
.total { font-family: var(--font-display); font-weight: 700; font-size: 3rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.cte-route { font-family: var(--font-mono); font-size: .8rem; opacity: .9; margin-top: 4px; }
.cte-body { padding: 16px 20px 20px; display: grid; gap: 14px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--result-soft); border-radius: 6px; padding: 8px 10px; min-width: 0; }
.kpi b { display: block; font-family: var(--font-mono); font-size: .95rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi small { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
.copy { background: var(--ink); color: var(--surface); border: 0; border-radius: 6px; padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; }
.copy-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#copied { font-size: .85rem; color: var(--good); }
textarea.fallback { width: 100%; font-family: var(--font-mono); font-size: .8rem; min-height: 120px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Calculadora de Frete</h1>
    <p>Origem fixa: São Paulo – SP · CEP 05094-010. Escolha a rota, preencha a carga e veja o valor final.</p>
    <div class="legend">
      <span><i class="sw" style="background:var(--fill)"></i>Preencher</span>
      <span><i class="sw" style="background:var(--route)"></i>Vem da rota (pode ajustar)</span>
      <span><i class="sw" style="background:var(--result)"></i>Resultado</span>
    </div>
  </header>

  <div class="main">
    <form class="panel" id="form" novalidate>
      <div>
        <p class="eyebrow">Rota</p>
        <label for="rota">Destino</label>
        <select id="rota"></select>
        <div class="route-facts" id="facts" style="margin-top:8px"></div>
      </div>

      <div>
        <label for="dist">Distância (km)</label>
        <input id="dist" class="in-route" type="number" min="0" step="1" inputmode="decimal">
      </div>
      <button type="button" class="reset" id="resetRoute">Voltar à distância da rota</button>

      <div>
        <p class="eyebrow">Carga</p>
        <div class="grid2">
          <div><label for="peso">Peso (kg)</label><input id="peso" class="in-fill" type="number" min="0" step="1" inputmode="decimal"></div>
          <div><label for="carga">Valor da carga (R$)</label><input id="carga" class="in-fill" type="number" min="0" step="0.01" inputmode="decimal"></div>
        </div>
      </div>
    </form>

    <section class="cte" aria-live="polite">
      <div class="cte-head">
        <p class="eyebrow">Valor final do frete</p>
        <div class="total" id="total">R$ 0,00</div>
        <div class="cte-route" id="cteRoute"></div>
      </div>
      <div class="cte-body">
        <div class="kpis">
          <div class="kpi"><small>Prazo</small><b id="kPrazo">–</b></div>
          <div class="kpi"><small>Distância</small><b id="kDist">–</b></div>
          <div class="kpi"><small>Peso</small><b id="kPeso">–</b></div>
        </div>
        <div class="copy-row">
          <button type="button" class="copy" id="copy">Copiar cotação</button>
          <span id="copied" hidden>Cotação copiada</span>
        </div>
        <textarea class="fallback" id="fallback" readonly hidden></textarea>
      </div>
    </section>
  </div>
</div>

<script>
// [UF, destino, CEP, prazo D+, distância km, custo/km R$]
const ROTAS = [
["SP","Campinas (região) – SP","13010-000",2,100,9.24],
["SP","Sorocaba (região) – SP","18010-000",2,100,9.24],
["SP","São José dos Campos (região) – SP","12210-000",2,90,10.15],
["SP","Bauru – SP","17010-000",2,330,3.75],
["SP","Marília – SP","17500-000",2,435,3.18],
["SP","Ribeirão Preto (região) – SP","14010-000",2,315,3.87],
["SP","São José do Rio Preto – SP","15010-000",2,440,3.16],
["PR","Curitiba – PR","80010-000",2,408,3.33],
["PR","Londrina – PR","86010-000",3,530,2.91],
["PR","Maringá – PR","87010-000",3,615,2.64],
["SC","Itajaí – SC","88301-000",3,605,2.68],
["SC","Florianópolis – SC","88010-000",3,705,2.46],
["SC","Chapecó – SC","89801-000",3,960,2.4],
["RS","Passo Fundo – RS","99010-000",3,990,2.35],
["RS","Porto Alegre – RS","90010-000",3,1110,2.15],
["MG","Belo Horizonte – MG","30110-000",3,585,2.71],
["RJ","Rio de Janeiro – RJ","20010-000",2,435,3.16],
["DF","Brasília – DF","70040-010",3,1010,2.1],
["GO","Goiânia – GO","74003-010",3,910,2.21],
["BA","Salvador – BA","40020-000",6,1960,1.72],
["PE","Recife – PE","50010-000",6,2630,1.77],
["PB","João Pessoa – PB","58010-000",6,2730,1.74],
["RN","Natal – RN","59010-000",6,2910,1.7],
["CE","Fortaleza – CE","60010-000",6,3120,1.66],
["MA","São Luís – MA","65010-000",6,2970,1.69],
["PA","Belém – PA","66010-000",11,2930,1.7],
["AP","Macapá – AP","68900-000",6,3300,2.41]
].map(([uf,dest,cep,prazo,km,ckm],i)=>({i,uf,dest,cep,prazo,km,ckm}));

// Taxas fixas do cálculo (não aparecem na tela)
const TAXA_KG = 0.5, GRIS = 0.008, TAXA_FIXA = 200, MARGEM = 0.15;

// Exemplo inicial
const DEFAULTS = { rota: 0, peso: 80, carga: 20000 };

const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const num = (v, d = 2) => v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const val = id => { const n = parseFloat($(id).value); return isFinite(n) ? n : 0; };

function fillSelect() {
  const groups = {};
  ROTAS.forEach(r => (groups[r.uf] ||= []).push(r));
  $("rota").innerHTML = Object.entries(groups).map(([uf, rs]) =>
    `<optgroup label="SP → ${uf}">${rs.map(r => `<option value="${r.i}">${r.dest} · CEP ${r.cep}</option>`).join("")}</optgroup>`
  ).join("");
}

function applyRoute(i) {
  $("rota").value = i;
  $("dist").value = ROTAS[i].km;
  calc();
}

function calc() {
  const r = ROTAS[+$("rota").value];
  const dist = val("dist"), peso = val("peso"), carga = val("carga");
  const sub = dist * r.ckm + peso * TAXA_KG + carga * GRIS + TAXA_FIXA;
  const total = sub * (1 + MARGEM);

  $("total").textContent = brl(total);
  $("cteRoute").textContent = `05094-010 São Paulo – SP → ${r.cep} ${r.dest}`;
  $("facts").innerHTML = `<span class="chip">CEP ${r.cep}</span><span class="chip">D+${r.prazo}</span><span class="chip">${num(r.km, 0)} km</span>`;
  $("kPrazo").textContent = `D+${r.prazo}`;
  $("kDist").textContent = `${num(dist, 0)} km`;
  $("kPeso").textContent = `${num(peso, 0)} kg`;
  return { r, dist, peso, carga, total };
}

function summary() {
  const c = calc();
  return [
    `COTAÇÃO DE FRETE`,
    `Rota: São Paulo – SP (05094-010) → ${c.r.dest} (${c.r.cep})`,
    `Prazo: D+${c.r.prazo}`,
    `Distância: ${num(c.dist, 0)} km`,
    `Peso: ${num(c.peso, 0)} kg`,
    `Valor da carga: ${brl(c.carga)}`,
    `VALOR FINAL DO FRETE: ${brl(c.total)}`
  ].join("\n");
}

fillSelect();
$("peso").value = DEFAULTS.peso; $("carga").value = DEFAULTS.carga;
applyRoute(DEFAULTS.rota);

$("rota").addEventListener("change", e => applyRoute(+e.target.value));
$("form").addEventListener("input", e => { if (e.target.id !== "rota") calc(); });
$("form").addEventListener("submit", e => e.preventDefault());
$("resetRoute").addEventListener("click", () => applyRoute(+$("rota").value));
$("copy").addEventListener("click", () => {
  const text = summary();
  const ok = () => { $("copied").hidden = false; setTimeout(() => $("copied").hidden = true, 2000); };
  const fail = () => { const t = $("fallback"); t.value = text; t.hidden = false; t.select(); };
  try { navigator.clipboard.writeText(text).then(ok, fail); } catch (_) { fail(); }
});
</script>
</body>
</html>
